apiVersion: v1
kind: Service
metadata:
  name: auth-service
spec:
  type: NodePort
  selector:
    app: auth-server
  ports:
    - protocol: TCP
      port: 5001
      targetPort: 5001
      nodePort: 30001
---

apiVersion: v1
kind: Service
metadata:
  name: order-service
spec:
  type: NodePort
  selector:
    app: order-server
  ports:
    - protocol: TCP
      port: 5002
      targetPort: 5002
      nodePort: 30002
---

apiVersion: v1
kind: Service
metadata:
  name: product-service
spec:
  type: NodePort
  selector:
    app: product-server
  ports:
    - protocol: TCP
      port: 5003
      targetPort: 5003
      nodePort: 30003
---

apiVersion: v1
kind: Service
metadata:
  name: mongodb
spec:
  type: ClusterIP
  selector:
    app: mongodb
  ports:
    - protocol: TCP
      port: 27017
      targetPort: 27017
