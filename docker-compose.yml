services:
  api-gateway:
    build: ./services/api-gateway
    image: microshop/api-gateway:1.0.0
    environment:
      SERVICE_NAME: api-gateway
      SERVICES: "auth,user,profile,product,catalog,inventory,cart,order,payment,shipping,notification,email,sms,search,review,recommendation,wishlist,coupon,analytics,reporting,media,audit,settings,scheduler"
    ports:
      - "3010:8080"
    depends_on:
      - auth
      - user
      - profile
      - product
      - catalog
      - inventory
      - cart
      - order
      - payment
      - shipping
      - notification
      - email
      - sms
      - search
      - review
      - recommendation
      - wishlist
      - coupon
      - analytics
      - reporting
      - media
      - audit
      - settings
      - scheduler
  auth:
    build: ./services/auth
    image: microshop/auth:1.0.0
    environment:
      SERVICE_NAME: auth
  user:
    build: ./services/user
    image: microshop/user:1.0.0
    environment:
      SERVICE_NAME: user
  profile:
