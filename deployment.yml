apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  labels:
    app: auth-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
      - imagePullSecrets:
        name: harbor-secret
      - name: auth-service
        image: 13.200.210.3:443/backend/auth-service:1.0
        ports:
        - containerPort: 5001
      - configMapRef:
        name: auth-config
      - secretRef:
        name: auth-secret   

---

