apiVersion: apps/v1
kind: Deployment
metadata:
  name: audit-service
  labels:
    app: audit-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: audit-service
  template:
    metadata:
      labels:
        app: audit-service
    spec:
      imagePullSerects:
        - name: harbor-secret
      containers:
      - name: audit-service
        image: 13.200.210.101:443/backend/audit:1.0
        ports:
        - containerPort: 8080
        envFrom:
          - configMapRef:
              name: audit-config 
